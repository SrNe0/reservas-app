spring.application.name=reservas-api

# Valores para correr contra el PostgreSQL del docker-compose; en Docker se sobrescriben con variables de entorno.
# La contraseña no tiene valor por defecto: se toma de SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas
spring.datasource.username=reservas

# Solo exponemos lo necesario; los detalles de salud no son públicos
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Flyway manda sobre el esquema; Hibernate solo comprueba que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
